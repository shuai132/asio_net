name: CI

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build-and-test:

    name: ${{ matrix.toolchain }}-${{ matrix.configuration }} sanitize_address:${{ matrix.sanitize_address }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        toolchain:
          - linux-gcc
          - macos-clang
          - windows-msvc
          - windows-mingw

        configuration:
          - Debug
          - Release

        sanitize_address:
          - OFF
          - ON

        include:
          - toolchain: linux-gcc
            os: ubuntu-latest
            compiler: gcc
            env:
              CMAKE_OPTIONS: "-DASIO_NET_ENABLE_SSL=ON"

          - toolchain: macos-clang
            os: macos-latest
            compiler: clang
            env:
              CMAKE_OPTIONS: "-DASIO_NET_ENABLE_SSL=ON"

          - toolchain: windows-msvc
            os: windows-latest
            compiler: msvc

          - toolchain: windows-mingw
            os: windows-latest
            compiler: mingw
            env:
              CMAKE_OPTIONS: "-G \"MinGW Makefiles\""

        exclude:
          - toolchain: macos-clang
            sanitize_address: ON
          - toolchain: windows-msvc
            sanitize_address: ON
          - toolchain: windows-mingw
            sanitize_address: ON

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Init ASIO
        run: |
          curl -fL --retry 3 https://github.com/chriskohlhoff/asio/archive/refs/tags/asio-1-32-0.tar.gz -o asio.tar.gz
          cmake -E tar xzf asio.tar.gz
          cmake -E rename asio-asio-1-32-0 asio

      - name: Init nlohmann/json
        working-directory: ..
        run: |
          curl -fL --retry 3 https://github.com/nlohmann/json/archive/refs/tags/v3.12.0.tar.gz -o json.tar.gz
          cmake -E tar xzf json.tar.gz
          cmake -E rename json-3.12.0 nlohmann_json

      - name: Configure (${{ matrix.configuration }}) sanitize_address:${{ matrix.sanitize_address }}
        env:
          ASIO_PATH: asio/asio/include
          NLOHMANN_JSON_PATH: nlohmann_json/include
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON ${{ matrix.env.CMAKE_OPTIONS }} -DASIO_NET_DISABLE_ON_DATA_PRINT=ON -DASIO_NET_ENABLE_SANITIZE_ADDRESS=${{ matrix.sanitize_address }}

      - name: Build with ${{ matrix.compiler }}
        run: cmake --build build --config ${{ matrix.configuration }} -j

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} -V --output-on-failure
